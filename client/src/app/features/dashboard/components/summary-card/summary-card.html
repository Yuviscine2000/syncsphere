<mat-card appearance="outlined" class="summary-card">
  <span
    [class]="'summary-card__indicator summary-card__indicator--' + card().tone"
    aria-hidden="true"
  >
    @switch (card().icon) {
      @case ('applications') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M7 3h7l5 5v13H7z" />
          <path d="M14 3v5h5" />
          <path d="M10 13h6M10 17h6" />
        </svg>
      }
      @case ('users') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="8" r="3.5" />
          <path d="M5 20c0-3.5 3.1-6 7-6s7 2.5 7 6" />
        </svg>
      }
      @case ('meetings') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="4" y="5" width="16" height="15" rx="2" />
          <path d="M8 3v4M16 3v4M4 10h16" />
        </svg>
      }
      @case ('notifications') {
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M6 16v-5a6 6 0 1 1 12 0v5l2 2H4z" />
          <path d="M10 21h4" />
        </svg>
      }
    }
  </span>

  <div class="summary-card__body">
    <p class="summary-card__label">{{ card().label }}</p>
    <p class="summary-card__value">{{ card().value }}</p>
    <p class="summary-card__description">{{ card().description }}</p>
  </div>
</mat-card>
